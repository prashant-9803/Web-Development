<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <script>
      async function calculate(operation) {
        let a = document.getElementById("a").value;
        let b = document.getElementById("b").value;

        let res = await fetch("http://localhost:3000/"+operation, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            a: a,
            b: b,
          }),
        });
        res = await res.json();

        let newDiv = document.getElementById("response");
        newDiv.innerText = res.ans;
      }
    </script>
  </head>
  <body>
    <div id="parent">
      <input type="number" id="a" />
      <input type="number" id="b" />

      <h3 id="response"></h3>

      <div>
        <button onclick="calculate('add')">Add</button>
        <button onclick="calculate('sub')">Sub</button>
        <button onclick="calculate('mult')">Mulitply</button>
        <button onclick="calculate('div')">Divide</button>
      </div>
    </div>
  </body>
</html>
